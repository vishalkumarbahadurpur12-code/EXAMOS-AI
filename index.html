<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EXAMOS AI — Smart Learning</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#5b4df5;
  --primary2:#7c3aed;
  --blue:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --border:#e5e7eb;
  --shadow:0 8px 30px rgba(15,23,42,.07)
}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  position:relative;
  padding-bottom:84px
}
.hidden{display:none!important}
.page{padding:18px}
.header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  padding:20px 18px 24px;
  border-radius:0 0 28px 28px
}
.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}
.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  object-fit:contain;
  background:#fff;
  padding:4px
}
.brand{
  display:flex;
  align-items:center;
  gap:11px
}
.brand h2{
  margin:0;
  font-size:21px
}
.brand small{opacity:.85}
.iconBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.18);
  color:#fff;
  font-size:20px
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow)
}
.heroCard{
  margin-top:-4px;
  position:relative
}
h1,h2,h3,p{margin-top:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:12px 0 7px
}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:13px;
  padding:13px;
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary)
}
textarea{resize:vertical;min-height:90px}
.btn{
  border:0;
  border-radius:14px;
  padding:13px 16px;
  font-weight:750;
  background:#eef2ff;
  color:#3730a3
}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff
}
.btn.blue{background:#eaf2ff;color:#1d4ed8}
.btn.green{background:#eaf8ee;color:#15803d}
.btn.red{background:#feecec;color:#b91c1c}
.btn.dark{background:#111827;color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px
}
.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px
}
.sectionTitle h3{margin:0}
.pill{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  background:#f0edff;
  color:#5b21b6;
  font-size:12px;
  font-weight:700
}
.choice{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  background:#fff;
  text-align:left;
  transition:.15s
}
.choice.active{
  border-color:var(--primary);
  background:#f4f2ff
}
.choice strong{display:block}
.choice small{color:var(--muted)}
.feature{
  padding:16px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#fff;
  min-height:115px
}
.featureIcon{
  font-size:25px;
  margin-bottom:8px
}
.stat{
  text-align:center;
  padding:13px 6px;
  background:#fafafa;
  border-radius:15px
}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--muted)}
.progress{
  height:9px;
  border-radius:99px;
  background:#e5e7eb;
  overflow:hidden
}
.progress div{
  height:100%;
  background:linear-gradient(90deg,#5b4df5,#8b5cf6);
  border-radius:99px
}
.bottomNav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:70px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50
}
.navBtn{
  border:0;
  background:transparent;
  color:#7b8190;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px
}
.navBtn.active{color:var(--primary);font-weight:800}
.navIcon{font-size:20px}
.aiFloat{
  position:fixed;
  right:max(18px,calc((100vw - 520px)/2 + 18px));
  bottom:83px;
  width:57px;
  height:57px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(135deg,#5b4df5,#9333ea);
  box-shadow:0 10px 28px rgba(91,77,245,.4);
  font-size:24px;
  z-index:45
}
.chatPanel{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:74px;
  width:min(500px,calc(100% - 20px));
  height:min(650px,calc(100vh - 100px));
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 20px 70px rgba(0,0,0,.22);
  z-index:100;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
.chatHead{
  padding:14px 16px;
  color:#fff;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:space-between
}
.chatMessages{
  flex:1;
  overflow:auto;
  padding:14px;
  background:#f8f8fc
}
.msg{
  max-width:86%;
  padding:11px 13px;
  border-radius:16px;
  margin-bottom:10px;
  line-height:1.5;
  white-space:pre-wrap;
  font-size:14px
}
.msg.ai{
  background:#fff;
  border:1px solid var(--border);
  border-top-left-radius:5px
}
.msg.user{
  margin-left:auto;
  color:#fff;
  background:#5b4df5;
  border-top-right-radius:5px
}
.chatImagePreview{
  max-width:150px;
  max-height:150px;
  border-radius:12px;
  margin-top:7px
}
.chatTools{
  display:flex;
  gap:7px;
  padding:9px 10px;
  border-top:1px solid var(--border);
  background:#fff
}
.chatTools button{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f0f1f5
}
.chatInput{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border)
}
.chatInput input{flex:1}
.sendBtn{
  width:48px;
  border:0;
  border-radius:13px;
  background:#5b4df5;
  color:#fff
}
.option{
  border:1px solid var(--border);
  padding:13px;
  border-radius:14px;
  margin:9px 0;
  background:#fff;
  text-align:left
}
.option.selected{border-color:#5b4df5;background:#f3f1ff}
.option.correct{border-color:#16a34a;background:#ecfdf3}
.option.wrong{border-color:#dc2626;background:#fef2f2}
.questionNo{
  color:#5b4df5;
  font-weight:800;
  font-size:13px
}
.timer{
  font-size:18px;
  font-weight:800;
  background:#111827;
  color:#fff;
  padding:7px 11px;
  border-radius:10px
}
.resultCircle{
  width:120px;
  height:120px;
  border-radius:50%;
  margin:10px auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0edff;
  color:#5b21b6;
  font-size:28px;
  font-weight:900
}
.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted)
}
.spinner{
  width:25px;
  height:25px;
  border:3px solid #ddd;
  border-top-color:#5b4df5;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:auto
}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:200;
  background:#111827;
  color:#fff;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  max-width:90%;
  box-shadow:0 8px 30px rgba(0,0,0,.2)
}
.authBox{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px
}
.authCard{
  width:100%;
  max-width:430px
}
.logoBig{
  width:85px;
  height:85px;
  object-fit:contain;
  background:#fff;
  border-radius:22px;
  padding:7px;
  box-shadow:var(--shadow)
}
.authTitle{text-align:center}
.tabRow{
  display:flex;
  background:#f1f2f6;
  padding:4px;
  border-radius:12px;
  margin-bottom:15px
}
.tab{
  flex:1;
  border:0;
  background:transparent;
  padding:10px;
  border-radius:9px;
  font-weight:700
}
.tab.active{background:#fff;color:#5b4df5}
.fileBtn{
  display:block;
  text-align:center;
  border:1px dashed #b7b9c5;
  padding:18px;
  border-radius:16px;
  cursor:pointer;
  background:#fafafa
}
.fileBtn input{display:none}
.analysisImage{
  width:100%;
  max-height:320px;
  object-fit:contain;
  border-radius:16px;
  background:#f5f5f5
}
.tag{
  display:inline-block;
  padding:6px 9px;
  background:#f0fdf4;
  color:#15803d;
  border-radius:8px;
  font-size:12px;
  margin:3px
}
.warn{
  padding:12px;
  border-radius:13px;
  background:#fff7ed;
  color:#9a3412;
  font-size:13px
}
.success{
  padding:12px;
  border-radius:13px;
  background:#ecfdf5;
  color:#166534;
  font-size:13px
}
@media(max-width:360px){
  .page{padding:13px}
  .grid2{gap:7px}
  .feature{padding:12px}
}
</style>
</head>

<body>

<div id="toast" class="toast hidden"></div>

<div id="authScreen" class="authBox">
  <div class="authCard">
    <div class="authTitle">
      <img src="logopng.png" class="logoBig" onerror="this.style.display='none'">
      <h1>EXAMOS AI</h1>
      <p class="muted">Smart Practice. Better Results. Learn with AI.</p>
    </div>

    <div class="card">
      <div class="tabRow">
        <button id="loginTab" class="tab active" onclick="showAuth('login')">Login</button>
        <button id="registerTab" class="tab" onclick="showAuth('register')">Create Account</button>
      </div>

      <label class="label">Student ID / Email</label>
      <input id="authId" placeholder="Enter student ID">

      <label class="label">Password</label>
      <input id="authPassword" type="password" placeholder="Enter password">

      <button id="authBtn" class="btn primary full" style="margin-top:16px" onclick="submitAuth()">
        Login
      </button>

      <p id="authHint" class="small muted" style="margin-top:12px;text-align:center">
        Your student account is securely stored with Firebase.
      </p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <div id="header"></div>

  <main id="main"></main>

  <button class="aiFloat" onclick="toggleChat()">✦</button>

  <div id="chatPanel" class="chatPanel hidden">
    <div class="chatHead">
      <div>
        <b>EXAMOS AI</b>
        <div style="font-size:11px;opacity:.8">Your personal study assistant</div>
      </div>
      <button class="iconBtn" onclick="toggleChat()">×</button>
    </div>

    <div id="chatMessages" class="chatMessages"></div>

    <div class="chatTools">
      <button title="Camera" onclick="document.getElementById('chatCamera').click()">📷</button>
      <button title="Gallery" onclick="document.getElementById('chatGallery').click()">🖼️</button>
      <button title="Voice" id="voiceBtn" onclick="toggleVoice()">🎙️</button>
      <button title="Speak last answer" onclick="speakLastAI()">🔊</button>
      <input id="chatCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="chatImageSelected(this)">
      <input id="chatGallery" type="file" accept="image/*" style="display:none" onchange="chatImageSelected(this)">
    </div>

    <div class="chatInput">
      <input id="chatInput" placeholder="Ask anything about your studies..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="sendBtn" onclick="sendChat()">➤</button>
    </div>
  </div>

  <nav class="bottomNav">
    <button class="navBtn active" data-page="home" onclick="navigate('home')">
      <span class="navIcon">⌂</span>Home
    </button>
    <button class="navBtn" data-page="test" onclick="navigate('test')">
      <span class="navIcon">📝</span>Test
    </button>
    <button class="navBtn" data-page="practice" onclick="navigate('practice')">
      <span class="navIcon">🎯</span>Practice
    </button>
    <button class="navBtn" data-page="analysis" onclick="navigate('analysis')">
      <span class="navIcon">📷</span>Analysis
    </button>
    <button class="navBtn" data-page="progress" onclick="navigate('progress')">
      <span class="navIcon">📊</span>Progress
    </button>
  </nav>
</div>

/* =========================================================
   HELPERS
========================================================= */

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.remove("hidden");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.add("hidden"),2600);
}

function authEmail(id){
  return String(id||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@student.examos.local";
}

function currentClassData(){
  return C[student.board]?.[student.class] || C.CBSE["10"];
}

function availableSubjects(){
  let arr=currentClassData().subjects||[];
  if(student.class==="11"||student.class==="12"){
    if(student.stream==="Science"){
      arr=arr.filter(x=>["physics","chemistry","math","biology","hindi","english"].includes(x.id));
    }else if(student.stream==="Commerce"){
      arr=arr.filter(x=>["accountancy","business","economics","math","hindi","english"].includes(x.id));
    }else if(student.stream==="Arts / Humanities"){
      arr=arr.filter(x=>["history","geography","political-science","economics","sociology","psychology","hindi","english"].includes(x.id));
    }
  }
  return arr;
}

function getSubject(id){
  return availableSubjects().find(x=>x.id===id) || availableSubjects()[0];
}

function getChapter(){
  const s=getSubject(selectedTestSubject||student.subjectId);
  return s?.chapters?.find(x=>x.id===selectedTestChapter);
}

function requestId(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}

function langHint(text){
  if(/[अ-ह]/.test(text) && /[a-zA-Z]/.test(text))return "Hinglish/Hindi";
  if(/[अ-ह]/.test(text))return "Hindi";
  return "English";
}

async function api(payload){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),50000);
  try{
    const r=await fetch("/api/ai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      cache:"no-store",
      signal:controller.signal,
      body:JSON.stringify(payload)
    });
    let d={};
    try{d=await r.json()}catch{}
    if(!r.ok)throw new Error(d.error||"AI server error");
    return d;
  }finally{
    clearTimeout(timeout);
  }
}

async function saveData(collection,data){
  if(!auth.currentUser)return;
  await db.collection("users").doc(auth.currentUser.uid)
    .collection(collection).add({
      ...data,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
}

async function loadProfile(uid){
  const snap=await db.collection("users").doc(uid).get();
  if(snap.exists){
    student={...student,...snap.data()};
  }
}

async function saveProfile(){
  if(!auth.currentUser)return;
  await db.collection("users").doc(auth.currentUser.uid).set({
    ...student,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
}

function showAuth(mode){
  authMode=mode;
  document.getElementById("loginTab").classList.toggle("active",mode==="login");
  document.getElementById("registerTab").classList.toggle("active",mode==="register");
  document.getElementById("authBtn").textContent=mode==="login"?"Login":"Create Account";
}

async function submitAuth(){
  const id=document.getElementById("authId").value.trim();
  const password=document.getElementById("authPassword").value;

  if(!id||!password){
    toast("Student ID और password डालें");
    return;
  }

  try{
    if(authMode==="register"){
      const c=await auth.createUserWithEmailAndPassword(authEmail(id),password);
      student.studentId=id;
      student.name="";
      await db.collection("users").doc(c.user.uid).set({
        studentId:id,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
      toast("Account बन गया");
    }else{
      await auth.signInWithEmailAndPassword(authEmail(id),password);
      toast("Login successful");
    }
  }catch(e){
    toast(e.message.replace("Firebase: ",""));
  }
}

auth.onAuthStateChanged(async user=>{
  if(user){
    try{
      await loadProfile(user.uid);
    }catch(e){}
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    render();
  }else{
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

async function startAITest(){

  const count=Number(document.getElementById("testCount").value);

  selectedTestChapter=chapter;

  selectedTestDifficulty=difficulty;

  try{

      previousQuestions:[]

    btn.disabled=false;
    btn.textContent="Generate AI Test";

}

/* =========================================================
   TEST RUN
========================================================= */

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    testSeconds--;
    const el=document.getElementById("timer");
    if(el)el.textContent=formatTime(testSeconds);
    if(testSeconds<=0){
      clearInterval(timerInterval);
      finishTest();
    }
  },1000);
}

function formatTime(sec){
  sec=Math.max(0,sec);
  const m=Math.floor(sec/60).toString().padStart(2,"0");
  const s=(sec%60).toString().padStart(2,"0");
  return m+":"+s;
}

function renderTestRun(){
  const q=currentTest[testIndex];
  if(!q)return;

  document.getElementById("main").innerHTML=`
    <div class="page">
      <div class="row" style="margin-bottom:12px">
        <div>
          <div class="questionNo">QUESTION ${testIndex+1} / ${currentTest.length}</div>
          <div class="small muted">${esc(selectedTestSubject)}</div>
        </div>
        <div class="timer" id="timer">${formatTime(testSeconds)}</div>
      </div>

      <div class="progress">
        <div style="width:${((testIndex+1)/currentTest.length)*100}%"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h3>${esc(q.question||q.questionText||"")}</h3>

        ${(q.options||[]).map((o,i)=>{
          const letter=String.fromCharCode(65+i);
          const selected=testAnswers[testIndex]===letter;
          return `
            <button class="option ${selected?"selected":""}" onclick="chooseAnswer('${letter}')">
              <b>${letter}.</b> ${esc(o)}
            </button>
          `;
        }).join("")}
      </div>

      <div class="row">
        <button class="btn" onclick="previousQuestion()" ${testIndex===0?"disabled":""}>← Previous</button>
        <button class="btn primary" onclick="${testIndex===currentTest.length-1?"finishTest()":"nextQuestion()"}">
          ${testIndex===currentTest.length-1?"Submit Test":"Next →"}
        </button>
      </div>
    </div>
  `;
}

function chooseAnswer(letter){
  testAnswers[testIndex]=letter;
  renderTestRun();
}

function previousQuestion(){
  if(testIndex>0){
    testIndex--;
    renderTestRun();
  }
}

function nextQuestion(){
  if(testIndex<currentTest.length-1){
    testIndex++;
    renderTestRun();
  }
}

async function finishTest(){
  clearInterval(timerInterval);

  let correct=0;
  const weak={};

  currentTest.forEach((q,i)=>{
    const ans=String(testAnswers[i]||"").toUpperCase();
    const ca=String(q.correctAnswer||q.answer||"").toUpperCase();
    if(ans===ca)correct++;

    if(ans!==ca){
      const topic=q.topic||q.chapter||"General";
      weak[topic]=(weak[topic]||0)+1;
    }
  });

  const percentage=Math.round(correct/currentTest.length*100);

  const record={
    board:student.board,
    class:student.class,
    stream:student.stream||"",
    subject:getSubject(selectedTestSubject)?.nameEn||selectedTestSubject,
    subjectId:selectedTestSubject,
    chapter:getChapter()?.nameEn||"All Chapters",
    score:correct,
    total:currentTest.length,
    percentage,
    weakTopics:Object.keys(weak),
    answers:testAnswers
  };

  try{
    await saveData("tests",record);
  }catch(e){}

  window.lastTestResult={
    ...record,
    questions:currentTest,
    weak
  };

  currentPage="testResult";
  render();
}

async function finishPractice(){
  let correct=0;
  const weak=[];

  currentPractice.forEach((q,i)=>{
    const ok=String(practiceAnswers[i]||"").toUpperCase()===String(q.correctAnswer||"").toUpperCase();
    if(ok)correct++;
    else weak.push(q.topic||window.practiceMeta.topic||"General");
  });

  const percentage=Math.round(correct/currentPractice.length*100);

  try{
    await saveData("practice",{
      ...window.practiceMeta,
      score:correct,
      total:currentPractice.length,
      percentage,
      weakTopics:[...new Set(weak)]
    });
  }catch(e){}

  window.practiceResult={
    score:correct,
    total:currentPractice.length,
    percentage,
    weak:[...new Set(weak)]
  };

  toast(`Practice complete: ${percentage}%`);

}

    document.getElementById("analysisPreview").innerHTML=

    document.getElementById("analyzeBtn").classList.remove("hidden");
  };
  reader.readAsDataURL(file);

async function analyzeSolution(){
  if(!analysisImageData){

    return;
  }

  const btn=document.getElementById("analyzeBtn");
  btn.disabled=true;
  btn.textContent="AI analyze कर रहा है...";

  try{
    const d=await api({
      mode:"analyze_solution",
      requestId:requestId(),
      board:student.board,
      class:student.class,
      stream:student.stream,
      subject:getSubject(student.subjectId)?.nameEn||"",
      imageBase64:analysisImageData
    });

    document.getElementById("analysisResult").innerHTML=`
      <div class="card">
        <h3>${d.isCorrect?"✅ Solution Correct":"❌ Mistake Detected"}</h3>

        ${d.mistake?`

        ${d.weakTopic?`

        ${d.correctMethod?`
          <h3>Correct Method</h3>
          <div style="white-space:pre-wrap;line-height:1.7">${esc(d.correctMethod)}</div>`:""}

        ${d.correctAnswer?`
          <h3>Correct Answer</h3>
          <div class="success">${esc(d.correctAnswer)}</div>`:""}

        ${d.conceptCheck?`
          <h3>Concept Check</h3>
          <div style="white-space:pre-wrap">${esc(d.conceptCheck)}</div>`:""}

        ${d.explanationHindi?`
          <h3>Explanation</h3>
          <div style="white-space:pre-wrap;line-height:1.7">${esc(d.explanationHindi)}</div>`:""}

        ${d.practiceTopic?`
          <button class="btn primary full" style="margin-top:15px"
            onclick="startAnalysisPractice('${encodeURIComponent(d.practiceTopic)}')">
            🎯 Practice This Topic
          </button>`:""}
      </div>
    `;
  }catch(e){
    document.getElementById("analysisResult").innerHTML=
      `<div class="card"><div class="warn">${esc(e.message)}</div></div>`;
  }finally{
    btn.disabled=false;
    btn.textContent="Analyze With AI";
  }
}

function startAnalysisPractice(topic){
  selectedPracticeTopic=decodeURIComponent(topic);
  navigate("practice");
  setTimeout(()=>{
    const x=document.getElementById("practiceTopic");
    if(x)x.value=selectedPracticeTopic;
  },100);
}

/* =========================================================
   PROGRESS
========================================================= */

async function renderProgress(){
  document.getElementById("main").innerHTML=`
    <div class="page">
      <div class="sectionTitle">
        <h2>My Progress</h2>
      </div>

      <div id="progressContent">
        <div class="card">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  `;

  try{
    const uid=auth.currentUser.uid;
    const tests=await db.collection("users").doc(uid).collection("tests").get();
    const practices=await db.collection("users").doc(uid).collection("practice").get();

    let totalScore=0;
    let questions=0;
    const weak={};

    tests.forEach(x=>{
      const d=x.data();
      totalScore+=Number(d.percentage||0);
      questions+=Number(d.total||0);
      (d.weakTopics||[]).forEach(t=>weak[t]=(weak[t]||0)+1);
    });

    practices.forEach(x=>{
      const d=x.data();
      (d.weakTopics||[]).forEach(t=>weak[t]=(weak[t]||0)+1);
    });

    const avg=tests.size?Math.round(totalScore/tests.size):0;

    const weakSorted=Object.entries(weak)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,8);

    document.getElementById("progressContent").innerHTML=`
      <div class="grid2">
        <div class="stat card"><b>${tests.size}</b><span>Tests</span></div>
        <div class="stat card"><b>${avg}%</b><span>Average Score</span></div>
        <div class="stat card"><b>${practices.size}</b><span>Practice Sessions</span></div>
        <div class="stat card"><b>${questions}</b><span>Questions</span></div>
      </div>

      <div class="card">
        <h3>Weak Topics</h3>
        ${
          weakSorted.length
          ?weakSorted.map(([topic,n])=>`
            <div style="margin:14px 0">
              <div class="row">
                <b style="font-size:13px">${esc(topic)}</b>
                <span class="small muted">${n} mistakes</span>
              </div>
              <div class="progress" style="margin-top:6px">
                <div style="width:${Math.min(100,n*15)}%"></div>
              </div>
            </div>
          `).join("")
          :`<div class="empty">अभी enough data नहीं है। पहले test या practice करें।</div>`
        }
      </div>

      <div class="card">
        <h3>Personalized Learning</h3>
        <p class="small muted">
          EXAMOS AI आपके test और practice performance से weak topics track करता है।
        </p>
        <button class="btn primary full" onclick="navigate('practice')">
          Practice Weak Topics
        </button>
      </div>
    `;
  }catch(e){
    document.getElementById("progressContent").innerHTML=
      `<div class="card"><div class="warn">${esc(e.message)}</div></div>`;
  }
}

/* =========================================================
   CHATBOT
========================================================= */

function toggleChat(){
  document.getElementById("chatPanel").classList.toggle("hidden");

  if(!document.getElementById("chatPanel").classList.contains("hidden") &&
     !document.getElementById("chatMessages").children.length){
    addChatMessage(
      "ai",
      `Hi ${student.name||"Student"} 👋\nमैं EXAMOS AI हूँ।\n\nआप text से पूछ सकते हैं, photo भेज सकते हैं या voice से सवाल बोल सकते हैं।`
    );
  }
}

function openChatWithWelcome(){
  document.getElementById("chatPanel").classList.remove("hidden");
  if(!document.getElementById("chatMessages").children.length){
    addChatMessage("ai","Hi! 👋 अपना study question पूछिए। आप photo या voice भी भेज सकते हैं।");
  }
}

function addChatMessage(type,text,image){
  const box=document.getElementById("chatMessages");
  const div=document.createElement("div");
  div.className="msg "+type;
  div.textContent=text||"";
  if(image){
    const img=document.createElement("img");
    img.src=image;
    img.className="chatImagePreview";
    div.appendChild(document.createElement("br"));
    div.appendChild(img);
  }
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

function chatImageSelected(input){
  const file=input.files?.[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=e=>{
    pendingChatImage=e.target.result;
    addChatMessage("user","📷 Photo attached",pendingChatImage);
    toast("Photo attached — अब Send दबाकर question भेजें");
  };
  reader.readAsDataURL(file);
  input.value="";
}

async function sendChat(){
  const input=document.getElementById("chatInput");
  const message=input.value.trim();

  if(!message&&!pendingChatImage){
    toast("Question लिखें या photo भेजें");
    return;
  }

  addChatMessage("user",message||"Please analyze this photo",pendingChatImage);

  input.value="";
  const image=pendingChatImage;
  pendingChatImage=null;

  addChatMessage("ai","Thinking...");

  const box=document.getElementById("chatMessages");
  const last=box.lastElementChild;

  try{
    const d=await api({
      mode:"chat",
      requestId:requestId(),
      message:message||"इस photo को देखकर question समझाओ और answer दो।",
      language:langHint(message||""),
      board:student.board,
      class:student.class,
      stream:student.stream,
      subject:getSubject(student.subjectId)?.nameEn||"",
      chapter:getChapter()?.nameEn||"",
      imageBase64:image||""
    });

    last.textContent=d.answer||"AI ने answer नहीं दिया।";
    lastAIAnswer=d.answer||"";
    box.scrollTop=box.scrollHeight;
  }catch(e){
    last.textContent="AI error: "+e.message;
  }
}

function speakLastAI(){
  if(!lastAIAnswer){
    toast("पहले AI से सवाल पूछें");
    return;
  }

  if(!("speechSynthesis" in window)){
    toast("इस browser में voice output supported नहीं है");
    return;
  }

  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lastAIAnswer);
  u.lang=/[अ-ह]/.test(lastAIAnswer)?"hi-IN":"en-IN";
  u.rate=.95;
  speechSynthesis.speak(u);
}

/* =========================================================
   VOICE INPUT
========================================================= */

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR)return null;

  const r=new SR();
  r.continuous=false;
  r.interimResults=false;
  r.lang="hi-IN";

  r.onstart=()=>{
    isVoiceListening=true;
    const b=document.getElementById("voiceBtn");
    if(b)b.textContent="⏹️";
    toast("बोलिए...");
  };

  r.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById("chatInput").value=text;
  };

  r.onerror=()=>{
    isVoiceListening=false;
    const b=document.getElementById("voiceBtn");
    if(b)b.textContent="🎙️";
  };

  r.onend=()=>{
    isVoiceListening=false;
    const b=document.getElementById("voiceBtn");
    if(b)b.textContent="🎙️";
  };

  return r;
}

function toggleVoice(){
  if(!recognition)recognition=setupRecognition();

  if(!recognition){
    toast("Voice input इस browser में supported नहीं है");
    return;
  }

  if(isVoiceListening){
    recognition.stop();
    return;
  }

  try{
    recognition.start();
  }catch(e){}
}

/* =========================================================
   INIT
========================================================= */

window.addEventListener("load",()=>{
  recognition=null;
});

/* Prevent accidental page reload while test is running */
window.addEventListener("beforeunload",e=>{
  if(currentPage==="testRun"){
    e.preventDefault();
    e.returnValue="";
  }
});
