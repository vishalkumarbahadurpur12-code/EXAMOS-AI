<html lang="en">

<title>EXAMOS AI</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fb;color:#151827}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

body{min-height:100vh}
#app{max-width:520px;margin:auto;min-height:100vh;background:#f4f6fb}

.screen{min-height:100vh;padding:20px 16px 90px}
.center{display:flex;align-items:center;justify-content:center}

.logo{
 width:112px;height:112px;border-radius:30px;object-fit:cover;
 box-shadow:0 12px 35px #5b35e83d;
}

.welcome{text-align:center;padding-top:55px}
.welcome h1{font-size:34px;margin:22px 0 8px;font-weight:900}
.subtitle{color:#6b7080;font-size:16px;margin-bottom:32px}

.card{
 background:white;border-radius:24px;padding:20px;
 box-shadow:0 8px 30px #17204a12;margin-bottom:15px;
}
.card h2{margin:0 0 14px;font-size:21px}

.btn{
 width:100%;border:0;border-radius:16px;padding:15px 18px;
 font-weight:800;color:white;background:linear-gradient(135deg,#5935e8,#833cf3);
 margin-top:10px;
}
.btn.secondary{background:#eef0ff;color:#5534dc}
.btn.dark{background:#171b35}
.btn.red{background:#ef4444}
.btn:disabled{opacity:.55}

.field{margin-bottom:14px}
.field label{display:block;font-weight:750;margin-bottom:7px;font-size:14px}
.field input,.field select,.field textarea{
 width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:14px;
 background:#fff;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7040ec}

.tabs{
 display:flex;background:#eef0f5;border-radius:15px;padding:4px;margin-bottom:18px
}
.tabs button{
 flex:1;border:0;background:transparent;padding:12px;border-radius:12px;font-weight:800
}
.tabs button.active{background:white;color:#6136df;box-shadow:0 3px 10px #0000000d}

.topbar{
 display:flex;align-items:center;justify-content:space-between;margin-bottom:18px
}
.topbar h1{font-size:25px;margin:0}
.iconbtn{
 width:42px;height:42px;border:0;border-radius:14px;background:white;
 box-shadow:0 5px 15px #0000000b;font-size:19px
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feature{
 background:white;border:0;border-radius:20px;padding:18px;text-align:left;
 box-shadow:0 7px 22px #17204a0b;min-height:135px
}
.feature .emoji{font-size:28px}
.feature b{display:block;font-size:16px;margin-top:12px}
.feature span{display:block;color:#777d8d;font-size:12px;margin-top:5px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:white;border-radius:18px;padding:15px;text-align:center}
.stat b{font-size:23px;display:block}
.stat span{font-size:11px;color:#777}

.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(520px,100%);background:#fff;border-top:1px solid #e5e6eb;
 display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;
 z-index:20
}
.nav button{border:0;background:none;color:#777;font-size:11px}
.nav button.active{color:#6136df;font-weight:800}
.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}

.option{
 border:1px solid #e1e3ea;background:#fff;border-radius:14px;
 padding:14px;margin:8px 0;text-align:left
}
.option.selected{border:2px solid #6339e7;background:#f5f1ff}
.option.correct{border:2px solid #22a06b;background:#effbf5}
.option.wrong{border:2px solid #ef4444;background:#fff2f2}

.progressbar{height:8px;background:#e7e8ee;border-radius:20px;overflow:hidden}
.progressbar div{height:100%;background:linear-gradient(90deg,#5935e8,#8b4cff)}

.question{font-size:18px;font-weight:750;line-height:1.55}
.small{font-size:13px;color:#777d8d}
.badge{
 display:inline-block;background:#eeeaff;color:#5d36db;
 padding:6px 10px;border-radius:99px;font-size:11px;font-weight:800
}

.chat{
 position:fixed;right:18px;bottom:75px;width:58px;height:58px;
 border:0;border-radius:50%;background:linear-gradient(135deg,#5935e8,#873cf2);
 color:white;font-size:25px;box-shadow:0 10px 30px #5d36db55;z-index:25
}

.modal{
 position:fixed;inset:0;background:#0008;z-index:50;
 display:flex;align-items:flex-end;justify-content:center
}
.sheet{
 width:min(520px,100%);background:#fff;border-radius:26px 26px 0 0;
 max-height:88vh;overflow:auto;padding:20px
}
.chatbox{height:58vh;display:flex;flex-direction:column}
.messages{flex:1;overflow:auto;padding:8px 0}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;margin:7px 0;line-height:1.45}
.msg.me{margin-left:auto;background:#6136df;color:#fff;border-bottom-right-radius:4px}
.msg.ai{background:#f0f1f5;border-bottom-left-radius:4px}
.chatinput{display:flex;gap:7px;margin-top:10px}
.chatinput input{flex:1;border:1px solid #ddd;border-radius:14px;padding:13px}
.circle{
 width:46px;height:46px;border:0;border-radius:14px;background:#eeeaff;color:#5b35e8
}

.drop{
 border:2px dashed #bfc2d1;border-radius:18px;padding:25px;text-align:center
}
.drop input{display:none}

.toast{
 position:fixed;top:18px;left:50%;transform:translateX(-50%);
 background:#141827;color:white;padding:14px 18px;border-radius:14px;
 z-index:100;max-width:90%;font-size:13px;box-shadow:0 10px 30px #0003
}

.loading{
 display:flex;gap:7px;align-items:center;justify-content:center;padding:25px
}
.dot{width:8px;height:8px;background:#6539e8;border-radius:50%;animation:b .8s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.25;transform:translateY(-5px)}}

.answerbox{
 background:#f6f4ff;border-radius:17px;padding:15px;margin-top:14px
}
</style>
</head>

<div id="chatModal" class="modal hidden" onclick="closeChatOutside(event)">

    <button class="circle" onclick="sendChat()">➤</button>
   </div>

  </div>

</div>

/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

function toast(msg){
 $("toast").textContent=msg;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),3000);
}

function authEmail(id){
 return String(id||"").trim().toLowerCase()
 .replace(/[^a-z0-9._-]/g,"")+"@student.examos.local";
}

function uid(){
 return "req_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function getClassConfig(){
 let c=curriculum[selectedBoard]?.[selectedClass];

 if(!c && selectedBoard==="Bihar Board"){
   c=curriculum.CBSE[selectedClass];
 }

 return c||null;
}

function getSubjects(){
 const c=getClassConfig();
 if(!c)return {};

 if(c.subjects)return c.subjects;

 if(c.streams){
   return c.streams[selectedStream]?.subjects||{};
 }

 return {};
}

function getSubject(){
 return getSubjects()[selectedSubject]||null;
}

function chapterNames(){
 return getSubject()?.chapters||[];
}

function subjectLabel(){
 const s=getSubject();
 return s ? `${s.en} / ${s.hi}` : "";
}

   LOGIN / REGISTER
========================================================= */

function renderAuth(mode="login"){
 $("app").innerHTML=`
 <div class="screen">
  <div class="welcome">
   <img class="logo" src="logopng.png" onerror="this.style.display='none'">
   <h1>EXAMOS AI</h1>
   <div class="subtitle">Smart Practice. Better Results. Learn with AI.</div>
  </div>

  <div class="card">
   <div class="tabs">
    <button id="loginTab" class="${mode==="login"?"active":""}"
      onclick="renderAuth('login')">Login</button>
    <button id="registerTab" class="${mode==="register"?"active":""}"
      onclick="renderAuth('register')">Create Account</button>
   </div>

   <div class="field">
    <label>Student ID / Email</label>
    <input id="authId" placeholder="e.g. Vishal">
   </div>

   <div class="field">
    <label>Password</label>
    <input id="authPass" type="password" placeholder="Password">
   </div>

   <button class="btn" onclick="${mode==="login"?"loginUser()":"registerUser()"}">
    ${mode==="login"?"Login":"Create Account"}
   </button>

   <p class="small" style="text-align:center;margin-top:18px">
    Your student account is securely stored with Firebase.
   </p>
  </div>
 </div>`;
}

window.renderAuth=renderAuth;

async function registerUser(){
 const id=$("authId").value.trim();
 const pass=$("authPass").value;

 if(!id||pass.length<6){
  toast("Student ID और कम से कम 6 character password डालें।");
  return;
 }

 try{
  const cred=await createUserWithEmailAndPassword(auth,authEmail(id),pass);

  await setDoc(doc(db,"users",cred.user.uid),{
   studentId:id,
   createdAt:Date.now()
  },{merge:true});

  toast("Account बन गया 🎉");
 }catch(e){
  toast(e.message);
 }
}

async function loginUser(){
 const id=$("authId").value.trim();
 const pass=$("authPass").value;

 if(!id||!pass){
  toast("Student ID और password डालें।");
  return;
 }

 try{
  await signInWithEmailAndPassword(auth,authEmail(id),pass);
 }catch(e){
  toast(e.message);
 }
}

window.profileBoardChanged=function(){
 selectedBoard=$("board").value;
 updateProfileSubjects();
}

window.profileClassChanged=function(){
 selectedClass=$("classSelect").value;

 const streamBox=$("streamBox");
 if(Number(selectedClass)>=11){
  streamBox.classList.remove("hidden");
  selectedStream=$("streamSelect").value;
 }else{
  streamBox.classList.add("hidden");
  selectedStream="";
 }

 updateProfileSubjects();
}

window.profileStreamChanged=function(){
 selectedStream=$("streamSelect").value;
 updateProfileSubjects();
}

function updateProfileSubjects(){
 const select=$("subjectSelect");
 if(!select)return;

 const subjects=getSubjects();

 select.innerHTML=Object.entries(subjects).map(([id,s])=>
  `<option value="${id}">${s.en} — ${s.hi}</option>`
 ).join("");

 selectedSubject=select.value;
}


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){
 const name=$("profileName").value.trim();

 selectedBoard=$("board").value;
 selectedClass=$("classSelect").value;

 if(Number(selectedClass)>=11)
   selectedStream=$("streamSelect").value;
 else
   selectedStream="";

 selectedSubject=$("subjectSelect").value;

 if(!name){
  toast("अपना नाम डालें।");
  return;
 }

 profile={
  name,
  board:selectedBoard,
  class:selectedClass,
  stream:selectedStream,
  subject:selectedSubject,
  updatedAt:Date.now()
 };

 await setDoc(doc(db,"users",user.uid),profile,{merge:true});

 toast("Profile saved 🎉");
 renderHome();
}

/* =========================================================
   AI QUESTIONS
========================================================= */

async function aiQuestions(config,mode="generate_questions"){

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),50000);

 try{
  const r=await fetch("/api/ai",{
   method:"POST",
   cache:"no-store",
   signal:controller.signal,
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    mode,
    requestId:uid(),
    board:profile.board,
    class:profile.class,
    stream:profile.stream||"",
    subject:subjectLabel(),
    ...config
   })
  });

  const d=await r.json();

  if(!r.ok)throw new Error(d.error||"AI request failed");

  if(!Array.isArray(d.questions)||!d.questions.length)
   throw new Error("AI ने questions नहीं भेजे।");

  return d.questions;

 }finally{
  clearTimeout(timer);
 }
}

/* =========================================================
   FINISH TEST
========================================================= */

async function finishTest(){

 let correct=0;

 questions.forEach((q,i)=>{
  if(norm(answers[i])===norm(q.correctAnswer))correct++;
 });

 const score=Math.round(correct/questions.length*100);

 const result={
  board:profile.board,
  class:profile.class,
  stream:profile.stream||"",
  subject:profile.subject,
  chapter:questions[0]?.chapter||"",
  score,
  correct,
  total:questions.length,
  date:Date.now(),
  questions,
  answers
 };

 try{
  await addDoc(
   collection(db,"users",user.uid,"profiles",profileKey(),"tests"),
   result
  );
 }catch(e){
  console.error(e);
 }

 renderResult(result);
}

function norm(x){
 return String(x||"").trim().toUpperCase().replace(/[^ABCD]/g,"").slice(0,1);
}

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);
 u.lang="hi-IN";
 u.rate=.92;
 u.pitch=1;

 speechSynthesis.speak(u);
};

  <button class="${active==="practice"?"active":""}" onclick="renderPracticeSetup()">

  </button>

  <button class="${active==="progress"?"active":""}" onclick="renderProgress()">
   <i>📊</i>Progress
  </button>
 </div>`;
}

/* =========================================================
   UTILITIES
========================================================= */

function fileToBase64(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

function escapeHTML(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function escapeAttr(v){
 return escapeHTML(v).replace(/`/g,"&#096;");
}

function formatText(v){
 return escapeHTML(v)
 .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
 .replace(/\n/g,"<br>");
}

onAuthStateChanged(auth,async u=>{

 if(!u){

 }

 try{

  if(snap.exists() && snap.data().name){

   profile=snap.data();

   selectedBoard=profile.board||"CBSE";
   selectedClass=profile.class||"10";

   selectedSubject=profile.subject||"mathematics";

   renderHome();

  }else{
   renderProfileSetup();
  }

 }catch(e){

  toast("Profile load नहीं हो पाया।");
  renderProfileSetup();
 }
});
